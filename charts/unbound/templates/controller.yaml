{{- if .Values.controller.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unbound.fullname" . }}
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
    {{- with .Values.controller.labels }}
    {{ toYaml . | indent 4 }}
    {{- end }}
  {{- with .Values.controller.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.controller.replicas }}
  replicas: {{ .Values.controller.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "unbound.selectorLabels" . | nindent 6 }}
  {{- with .Values.controller.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.controller.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "unbound.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "unbound.serviceAccountName" . }}
      containers:
        - name: {{ template "unbound.name" . }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dns-udp
              containerPort: {{ .Values.service.dns.port }}
              protocol: UDP
            - name: dns-tcp
              containerPort: {{ .Values.service.dns.port }}
              protocol: TCP
          env:
            - name: UNBOUND_PORT
              value: {{ .Values.service.dns.port | squote }}
          {{- if .Values.metricsExporter.enabled }}
          args:
            - /bin/sh
            - -ec
            - |
              cat >> /etc/unbound/unbound.conf <<'EOF'
              remote-control:
                  control-enable: yes
                  control-interface: 127.0.0.1
                  control-port: 8953
                  control-use-cert: no
              EOF
              exec "$@"
            - --
            - /usr/sbin/unbound
            - -v
            - -d
          {{- end }}
          livenessProbe:
            exec:
              command: ['dig', '@127.0.0.1', '-p', {{ .Values.service.dns.port | squote }}, 'cloudflare.com']
          readinessProbe:
            exec:
              command: ['dig', '@127.0.0.1', '-p', {{ .Values.service.dns.port | squote }}, 'cloudflare.com']
          resources: {{ if not .Values.resources -}}{}{{- end }}
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
        {{- if .Values.metricsExporter.enabled }}
        - name: metrics-exporter
          image: "{{ .Values.metricsExporter.image.repository }}:{{ .Values.metricsExporter.image.tag }}"
          imagePullPolicy: {{ .Values.metricsExporter.image.pullPolicy }}
          args:
            - -web.listen-address=:{{ .Values.metricsExporter.port }}
            - -unbound.host=tcp://127.0.0.1:8953
            - -unbound.ca=
            - -unbound.cert=
            - -unbound.key=
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsExporter.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.metricsExporter.securityContext | nindent 12 }}
          resources: {{ if not .Values.metricsExporter.resources -}}{}{{- end }}
            {{- if .Values.metricsExporter.resources }}
            {{- toYaml .Values.metricsExporter.resources | nindent 12 }}
            {{- end }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
