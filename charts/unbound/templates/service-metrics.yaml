{{- if .Values.metricsExporter.enabled -}}
{{- if not .Values.controller.enabled -}}
  {{- fail "\".Values.metricsExporter.enabled\" requires \".Values.controller.enabled\" to be set to true!" -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "unbound.fullname" .) }}
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
    {{- with .Values.service.metrics.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    service: {{ printf "%s-metrics" (include "unbound.fullname" .) }}
  {{- with .Values.service.metrics.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metricsExporter.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "unbound.selectorLabels" . | nindent 4 }}
{{- end }}
